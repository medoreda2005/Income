<button onclick="endShift()">إنهاء الوردية</button>

<div id="history">
  <h3>سجل الورديات السابقة</h3>
  <ul id="shiftList"></ul>
</div>

<script>
  let totalIncome = 0;
  let totalExpense = 0;

  function updateUI() {
    document.getElementById('totalIncome').textContent = totalIncome;
    document.getElementById('totalExpense').textContent = totalExpense;
    document.getElementById('netIncome').textContent = totalIncome - totalExpense;
  }

  function addIncome() {
    const amount = prompt("أدخل مبلغ الدخل:");
    if (amount && !isNaN(amount)) {
      totalIncome += Number(amount);
      updateUI();
    }
  }

  function addExpense() {
    const amount = prompt("أدخل مبلغ الخارج:");
    if (amount && !isNaN(amount)) {
      totalExpense += Number(amount);
      updateUI();
    }
  }

  function endShift() {
    // حفظ بيانات الوردية في القائمة
    const li = document.createElement("li");
    li.textContent = `الدخل: ${totalIncome} | الخارج: ${totalExpense} | الصافي: ${totalIncome - totalExpense}`;
    document.getElementById("shiftList").appendChild(li);

    // تصفير القيم للوردية الجديدة
    totalIncome = 0;
    totalExpense = 0;
    updateUI();
  }

  updateUI();
</script>
